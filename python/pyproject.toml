[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "puigdist"
version = "0.1.0"
description = "Distribución de Puig: χ no central generalizada con dimensión real k (port desde DistributionsPuig.jl)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Diego Puig", email = "dpuig@upv.es" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "mpmath>=1.3",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]